<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Not found — Served</title>
    <meta name="robots" content="noindex" />
    <style>
      /* Page autonome : aucune dependance au build. Une page 404 qui a besoin
         du JavaScript de l'application pour s'afficher est une page 404 qui
         echouera exactement le jour ou l'application est cassee. */
      @font-face {
        font-family: 'Plex Mono';
        font-weight: 600;
        font-display: swap;
        src: url('/fonts/plex-mono-600-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6,
          U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122,
          U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Plex Sans';
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/plex-sans-400-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6,
          U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122,
          U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        background: #f4f3f0;
        color: #14161a;
        font-family: 'Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI',
          Roboto, Helvetica, Arial, sans-serif;
        font-size: 1.05rem;
        line-height: 1.58;
      }
      main {
        max-width: 42rem;
        margin-inline: auto;
        padding: 3rem clamp(1.15rem, 5vw, 4rem);
      }
      h1 {
        font-family: 'Plex Mono', ui-monospace, Menlo, Consolas, monospace;
        font-weight: 600;
        font-size: clamp(1.9rem, 1.2rem + 3vw, 3.4rem);
        line-height: 1.02;
        letter-spacing: -0.035em;
        margin: 0 0 1rem;
      }
      p {
        color: #5a5f66;
        max-width: 46ch;
      }
      a {
        color: #14161a;
      }
      code {
        font-family: 'Plex Mono', ui-monospace, Menlo, Consolas, monospace;
        font-size: 0.92em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404. Nothing here.</h1>
      <p>
        This address does not exist on <code>cortexafrica.github.io</code>. That is a
        dead link, and a dead link is one of the things we check for on other
        people’s sites — so if you reached this page from somewhere on ours,
        we would genuinely like to know.
      </p>
      <p>
        <a href="/">Back to the audit</a>
      </p>
    </main>
  </body>
</html>
